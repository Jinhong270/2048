<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Classic 2048 number-merging game with keyboard, touch swipe and button controls, plus smooth merge animations.">
    <meta name="theme-color" content="#faf8ef">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23edc22e'/%3E%3Ctext x='50' y='63' font-size='26' font-family='Arial, sans-serif' font-weight='bold' fill='%23f9f6f2' text-anchor='middle'%3E2048%3C/text%3E%3C/svg%3E">
    <title>2048(Made by Jinhong270)</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/controls.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/language.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="title-group">
                <h1 class="title">2048</h1>
                <p class="subtitle" data-i18n="header.subtitle">Merge matching numbers and reach 2048</p>
            </div>
            <div class="header-actions">
                <div class="score-box">
                    <span class="score-label" data-i18n="score.label">Score</span>
                    <span class="score-value" id="scoreValue">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label" data-i18n="best.label">Best</span>
                    <span class="score-value" id="bestValue">0</span>
                </div>
                <button class="reset-btn" id="resetBtn" data-i18n="action.newGame">New Game</button>
            </div>
        </header>

        <main class="game-wrapper">
            <div class="board-section">
                <div class="board" id="board">
                    <div class="grid" id="grid"></div>
                    <div class="tiles-layer" id="tilesLayer"></div>
                </div>
            </div>
            <div class="controls">
                <div class="dpad">
                    <button class="btn btn-up" data-dir="up" aria-label="Move up" data-i18n-aria-label="move.up">▲</button>
                    <button class="btn btn-left" data-dir="left" aria-label="Move left" data-i18n-aria-label="move.left">◀</button>
                    <button class="btn btn-right" data-dir="right" aria-label="Move right" data-i18n-aria-label="move.right">▶</button>
                    <button class="btn btn-down" data-dir="down" aria-label="Move down" data-i18n-aria-label="move.down">▼</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <select class="lang-select" id="langSelect" aria-label="Language" data-i18n-aria-label="language.label"></select>
        </footer>
    </div>

    <div id="winModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="winModalMsg">
        <div class="modal-content">
            <p id="winModalMsg" data-i18n="dialog.win">Congratulations! You reached 2048!</p>
            <div class="modal-buttons">
                <button id="continueBtn" class="modal-btn" data-i18n="action.continue">Keep Playing</button>
                <button id="newGameFromWinBtn" class="modal-btn" data-i18n="action.newGame">New Game</button>
            </div>
        </div>
    </div>

    <div id="gameOverModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="gameOverModalMsg">
        <div class="modal-content">
            <p id="gameOverModalMsg" data-i18n="dialog.gameOver">Game over! No more moves available.</p>
            <div class="modal-buttons">
                <button id="newGameFromOverBtn" class="modal-btn" data-i18n="action.newGame">New Game</button>
            </div>
        </div>
    </div>

    <div id="liveRegion" class="visually-hidden" aria-live="polite"></div>

    <script src="js/i18n.js"></script>
    <script src="js/locales/en-US.js"></script>
    <script src="js/locales/zh-CN.js"></script>
    <script src="js/locales/zh-TW.js"></script>
    <script src="js/locales/es.js"></script>
    <script src="js/locales/fr.js"></script>
    <script src="js/locales/de.js"></script>
    <script src="js/locales/ja.js"></script>
    <script src="js/locales/ko.js"></script>
    <script src="js/locales/pt-BR.js"></script>
    <script src="js/locales/ru.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/viewport.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
